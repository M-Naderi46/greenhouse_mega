; ============================================================================
;  PlatformIO project - Greenhouse controller, Arduino Mega 2560 (ATmega2560)
;
;    pio run                 build
;    pio run -t upload       upload through the USB cable (Mega bootloader)
;    pio run -t size         memory usage
;    pio device monitor      serial monitor (CSV log, 9600 baud)
;
;  Bare-metal C (no Arduino framework): avr-gcc + avr-libc only.
;  Pins and options: include/user_config.h
; ============================================================================

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
; no framework -> bare metal

; every folder in lib/ is a library; find the dependencies of all of them
lib_ldf_mode = deep+
; link library objects directly (keeps the interrupt handlers from being dropped)
lib_archive = no

; PlatformIO gives include/ only to src/, NOT to lib/ -> add it here
build_flags =
    -Iinclude
    -Wall
    -Wextra

monitor_speed = 9600
; upload_port = COM3        ; set if auto-detection picks the wrong port
